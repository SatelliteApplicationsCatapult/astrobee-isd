# Joystick inputs

# Max wrench command values
# Based off ReSWARM paper: arxiv.org/pdf/2301.01319
# Using conservative values near the 2500 RPM motor speeds, even though it should be able to
# go faster (in ff_msgs/msg/FlightMode.msg, impeller speed max should correspond to 2800 RPM?)
# Torques set to 1/10 of forces, as rough estimate noted also in paper
wrench_command:
  max_force: [0.6, 0.3, 0.3]      # N
  max_torque: [0.06, 0.03, 0.03]  # Nm

# Values reported by Gazebo sim
# gz model -m honey -i | grep -E "name:|mass:" | grep -B1 "mass:"
# gz model -m honey -i | grep -A24 -B10 'mass: 9.3955'
# 9.3955 +(0.1623 + 0.1033 + 0.04 + 0.0116026 + 0.04 + 0.02285)
robot_sim:
  mass: 9.7756                       # kg, body + stowed arm
  inertia: [0.1737, 0.1649, 0.1865]  # kg m^2, body axes, diagonal

  # Static transform from robot body to perch cam
  # rosrun tf tf_echo honey/perch_cam honey/body
  # - Translation: [0.017, -0.051, -0.133]
  # - Rotation: in Quaternion [-0.000, 0.707, -0.000, 0.707]
  #             in RPY (radian) [0.000, 1.571, 0.000]
  #             in RPY (degree) [0.000, 90.000, 0.000]
  # Can also use this custom script using lookup_transform,
  # since tf_echo does not support precision:
  # cd $CUSTOM_WS/ros_ws_astrobee/src/astrobee_joy_teleop/scripts/
  # python3 tf_echo_precise.py honey/perch_cam honey/body 6 1
  # - Translation: [0.016600, -0.050900, -0.133100]
  # - Rotation: in Quaternion [-0.000000, 0.707107, -0.000000, 0.707107]
  #             in RPY (radian) [-0.000000, 1.570796, 0.000000]
  #             in RPY (degree) [-0.000000, 90.000000, 0.000000]
  robot_in_perch_tf:
    position: [0.016600, -0.050900, -0.133100]   # x y z
    orientation: [0.0, 0.707107, 0.0, 0.707107]  # x y z w

# self.robot_in_perch_tf = pu.pose_msg_to_array(
#     Pose(position=Point(0.017, -0.051, -0.133),
#           orientation=Quaternion(0.0, np.sqrt(2.0) / 2.0, 0.0, np.sqrt(2.0) / 2.0)))

# Flight assist (inertial damping)
flight_assist:
  lin_vel_decay_time: 1.0  # s
  ang_vel_decay_time: 1.0  # s
